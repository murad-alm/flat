<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bright renovated flat in Spandau, 64 m²</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="hero">
        <div class="wrap">
            <div class="topbar">
                <div class="lang" role="group" data-i18n-aria="lang_group" aria-label="Language">
                    <button type="button" data-lang="en" lang="en" aria-pressed="true">EN</button>
                    <button type="button" data-lang="de" lang="de" aria-pressed="false">DE</button>
                </div>
            </div>

            <div class="hero-grid">
                <figure class="ph hero-photo" data-alt="alt_hero" data-photos="photos/hero.jpg">
                    <div class="hint"><b data-i18n="ph_hero">Main photo</b><span class="path"></span></div>
                </figure>

                <div class="sheet">
                    <p class="place" data-i18n="place"/>
                    <h1 data-i18n="h1"></h1>
                    <p class="lede" data-i18n="lede"/>
                    <p class="anmeldung", data-i18n="anmeldung"/>
                    <dl class="facts">
                        <div><dt data-i18n="f_size"></dt>
                            <dd data-i18n="f_size_v"></dd>
                        </div>
                        <div><dt data-i18n="f_furn"></dt>
                            <dd data-i18n="f_furn_v"></dd>
                        </div>
                        <div><dt data-i18n="f_avail"></dt>
                            <dd data-i18n="f_avail_v"></dd>
                        </div>
                        <div><dt data-i18n="f_stat"></dt>
                            <dd data-i18n="f_stat_v"></dd>
                        </div>
                    </dl>

                    <a class="btn" href="#contact" data-i18n="btn_view">Request a viewing</a>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section id="photos" aria-labelledby="photos-h">
            <div class="wrap">
                <h2 id="photos-h" data-i18n="photos_h">Photos</h2>
                <div class="gallery">
                    <figure class="ph shot wide" data-cap="cap_living" data-photos="photos/living-room-1.jpg, photos/living-room-2.jpg">
                        <div class="hint"><b data-i18n="cap_living">Living room</b><span class="path"></span></div>
                        <figcaption data-i18n="cap_living">Living room</figcaption>
                        <span class="count" hidden></span>
                    </figure>
                    <figure class="ph shot" data-cap="cap_kitchen" data-photos="photos/kitchen-1.jpg, photos/kitchen-2.jpg">
                        <div class="hint"><b data-i18n="cap_kitchen">Kitchen</b><span class="path"></span></div>
                        <figcaption data-i18n="cap_kitchen">Kitchen</figcaption>
                        <span class="count" hidden></span>
                    </figure>
                    <figure class="ph shot" data-cap="cap_bath" data-photos="photos/bathroom-1.jpg">
                        <div class="hint"><b data-i18n="cap_bath">Bathroom</b><span class="path"></span></div>
                        <figcaption data-i18n="cap_bath">Bathroom</figcaption>
                        <span class="count" hidden></span>
                    </figure>
                    <figure class="ph shot third" data-cap="cap_bed" data-photos="photos/bedroom-1.jpg, photos/bedroom-2.jpg">
                        <div class="hint"><b data-i18n="cap_bed">Bedroom</b><span class="path"></span></div>
                        <figcaption data-i18n="cap_bed">Bedroom</figcaption>
                        <span class="count" hidden></span>
                    </figure>
                    <figure class="ph shot third" data-cap="cap_balc" data-photos="photos/balcony-1.jpg, photos/balcony-2.jpg">
                        <div class="hint"><b data-i18n="cap_balc">Balcony</b><span class="path"></span></div>
                        <figcaption data-i18n="cap_balc">Balcony</figcaption>
                        <span class="count" hidden></span>
                    </figure>
                    <figure class="ph shot third" data-cap="cap_store" data-photos="photos/entrance-1.jpg">
                        <div class="hint"><b data-i18n="cap_store">Entrance</b><span class="path"></span></div>
                        <figcaption data-i18n="cap_store">Entrance</figcaption>
                        <span class="count" hidden></span>
                    </figure>
                </div>
            </div>
        </section>

        <section aria-labelledby="details-h">
            <div class="wrap">
                <h2 id="details-h" data-i18n="flat_h"></h2>
                <div class="cols">
                    <div class="panel">
                        <h3 data-i18n="reno_h"></h3>
                        <ul>
                            <li data-i18n="reno_1">
                            <li data-i18n="reno_2">
                            <li data-i18n="reno_3">
                            <li data-i18n="reno_4">
                        </ul>
                    </div>
                    <div class="panel">
                        <h3 data-i18n="liv_h"></h3>
                        <ul>
                            <li data-i18n="liv_1">
                            <li data-i18n="liv_2">
                            <li data-i18n="liv_3">
                            <li data-i18n="liv_5">
                        </ul>
                    </div>
                </div>
            </div>
        </section>

        <section aria-labelledby="loc-h">
            <div class="wrap">
                <h2 id="loc-h" data-i18n="loc_h"></h2>
                <div class="cols">
                    <div class="panel">
                        <h3 data-i18n="get_h"></h3>
                        <ul>
                            <li data-i18n="get_1"/>
                            <li data-i18n="get_2"/>
                            <li data-i18n="get_3"/>
                        </ul>
                    </div>
                    <div class="panel">
                        <h3 data-i18n="nat_h"></h3>
                        <ul>
                            <li data-i18n="nat_1"/>
                            <li data-i18n="nat_2"/>
                            <li data-i18n="nat_3"/>
                            <li data-i18n="nat_4"/>
                        </ul>
                    </div>
                </div>
            </div>
        </section>

        <section id="contact" class="contact" aria-labelledby="contact-h">
            <div class="wrap">
                <h2 id="contact-h" data-i18n="c_h"></h2>
                <p data-i18n="c_p"/>
                <div class="actions">
                    <a class="btn" id="wa" href="https://t.me/miro_963?text=Hi%2C%20I%27m%20interested%20in%20the%20flat%20in%20Spandau.%20When%20could%20I%20visit%3F" target="_blank" rel="noopener" data-i18n="wa_btn"></a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="wrap" data-i18n="foot"/>
    </footer>

    <dialog id="lightbox" data-i18n-aria="lb_label" aria-label="Photo viewer">
        <button type="button" id="close" data-i18n-aria="lb_close" aria-label="Close photo">×</button>
        <button type="button" class="lb-nav lb-prev" id="prev" data-i18n-aria="lb_prev" aria-label="Previous photo" hidden>‹</button>
        <button type="button" class="lb-nav lb-next" id="next" data-i18n-aria="lb_next" aria-label="Next photo" hidden>›</button>
        <img id="lb-img" alt="">
        <p id="lb-cap"></p>
    </dialog>

    <script src="script.js" defer></script>
</body>

</html>
